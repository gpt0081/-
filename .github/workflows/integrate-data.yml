name: Consolidate historical research data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_all.py'
      - 'scripts/reconcile_central_registries.py'
      - 'scripts/audit_integration.py'
      - 'scripts/link_operational_layers.py'
      - 'scripts/triage_integration.py'
      - 'scripts/audit_politician_references.py'
      - 'data/**'
      - '!data/integration/generated/**'
      - '!data/integration/canonical/**'
      - '.github/workflows/integrate-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: write
concurrency:
  group: historical-integration-main
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate every source and preserve conflicts
        id: consolidate
        shell: bash
        run: |
          set +e
          python scripts/integrate_all.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Synchronize canonical events and politicians into operational roots
        id: root_sync
        shell: bash
        run: |
          set +e
          python scripts/reconcile_central_registries.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Link evidence, annals, coverage and lead queues
        id: link
        shell: bash
        run: |
          set +e
          python scripts/link_operational_layers.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate source preservation and central root coverage
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/audit_integration.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build per-source integration triage
        run: python scripts/triage_integration.py
      - name: Audit politician file references and event/document links
        id: politician_audit
        shell: bash
        run: |
          set +e
          python scripts/audit_politician_references.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve generated audit and inventory reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-audit
          path: data/integration/generated/
          retention-days: 14
          if-no-files-found: warn
      - name: Commit central registries and generated audit
        if: steps.consolidate.outputs.exit_code == '0' || steps.consolidate.outputs.exit_code == '1'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/politicians.json data/integration/generated data/integration/canonical
          if ! git diff --cached --quiet; then
            git commit -m 'integration: synchronize central registries and preserve audit'
            git push
          fi
      - name: Enforce integration completeness gate
        if: always()
        shell: bash
        env:
          CONSOLIDATE_EXIT: ${{ steps.consolidate.outputs.exit_code }}
          ROOT_SYNC_EXIT: ${{ steps.root_sync.outputs.exit_code }}
          LINK_EXIT: ${{ steps.link.outputs.exit_code }}
          AUDIT_EXIT: ${{ steps.audit.outputs.exit_code }}
          POLITICIAN_AUDIT_EXIT: ${{ steps.politician_audit.outputs.exit_code }}
        run: |
          if [ "$CONSOLIDATE_EXIT" != "0" ] || [ "$ROOT_SYNC_EXIT" != "0" ] || [ "$LINK_EXIT" != "0" ] || [ "$AUDIT_EXIT" != "0" ] || [ "$POLITICIAN_AUDIT_EXIT" != "0" ]; then
            echo "::error::FULL_INTEGRATION_INCOMPLETE: reports preserved; unresolved conflicts or references remain."
            exit 1
          fi
