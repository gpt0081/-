name: Consolidate historical research data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_all.py'
      - 'scripts/audit_integration.py'
      - 'scripts/link_operational_layers.py'
      - 'data/**'
      - '.github/workflows/integrate-data.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate sources and audit collisions
        run: python scripts/integrate_all.py
      - name: Link operational evidence and annals layers
        run: python scripts/link_operational_layers.py
      - name: Validate provenance and inventory completeness
        run: python scripts/audit_integration.py
      - name: Commit generated indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/integration/generated
          if ! git diff --cached --quiet; then
            git commit -m 'integration: regenerate all-source evidence indexes and audit'
            git push
          fi
